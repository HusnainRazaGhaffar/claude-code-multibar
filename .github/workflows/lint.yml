name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        # bash -n parses only its first argument; one invocation per file.
        run: |
          bash -n statusline.sh
          bash -n subagent-statusline.sh
      - name: ShellCheck (max verbosity, zero findings expected)
        run: shellcheck -S style statusline.sh subagent-statusline.sh
